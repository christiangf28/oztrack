<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semmly — Companion app para GLP-1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FBF7F5;
      color: #2D1A1F;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      text-align: center; max-width: 480px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 36px; font-weight: 900; color: #D4748F; margin-bottom: 8px; }
    p { font-size: 16px; color: #4A3038; line-height: 1.6; margin-bottom: 28px; }
    .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a {
      color: #D4748F; text-decoration: none; font-weight: 600;
      border: 1.5px solid #D4748F; border-radius: 999px;
      padding: 10px 22px; font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }
    a:hover { background: #D4748F; color: #fff; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🌸</div>
  <h1>Semmly</h1>
  <p>Tu companion app para el seguimiento de síntomas durante el tratamiento con GLP-1 (Ozempic, Wegovy, Mounjaro y más).</p>
  <div class="links">
    <a href="/privacy.html">Política de Privacidad</a>
    <a href="mailto:support@getsemmly.app">Soporte</a>
  </div>
</div>
</body>
</html>
